<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">HomeIntel application architecture</title>
  <desc id="desc">Diagram showing the React browser application, Vite server integration boundary, local data, external APIs, and the BLS fallback path.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#172033" flood-opacity=".09"/></filter>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c6cff"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#25a77a"/></marker>
    <style>
      .title{font:700 30px Inter,Arial,sans-serif;fill:#172033}.group{font:700 15px Inter,Arial,sans-serif;letter-spacing:1.5px}.h{font:700 15px Inter,Arial,sans-serif;fill:#172033}.p{font:13px Inter,Arial,sans-serif;fill:#536075}.small{font:12px Inter,Arial,sans-serif;fill:#536075}.box{fill:#fff;stroke-width:1.5;rx:14;filter:url(#shadow)}.line{fill:none;stroke-width:2;marker-end:url(#arrow-purple)}
    </style>
  </defs>
  <rect width="1600" height="940" fill="#f8fafc"/>
  <text x="42" y="48" class="title">HomeIntel application architecture</text>
  <rect x="40" y="80" width="450" height="805" rx="20" fill="#f4f6ff" stroke="#7c83ff" stroke-width="2"/><text x="65" y="115" class="group" fill="#39469c">BROWSER / REACT APPLICATION</text>
  <rect x="525" y="80" width="440" height="805" rx="20" fill="#f6f2ff" stroke="#8b6cff" stroke-width="2"/><text x="550" y="115" class="group" fill="#5c3fa0">SERVER INTEGRATION BOUNDARY</text>
  <rect x="1000" y="80" width="560" height="805" rx="20" fill="#effaf7" stroke="#25a77a" stroke-width="2"/><text x="1025" y="115" class="group" fill="#197858">EXTERNAL DATA PROVIDERS</text>
  <g transform="translate(70 145)"><rect class="box" width="390" height="85" stroke="#9aa5ff"/><text x="22" y="31" class="h">Pages &amp; components</text><text x="22" y="56" class="p">Dashboard, charts, maps, cards, tabs and pagination</text></g>
  <g transform="translate(70 265)"><rect class="box" width="180" height="100" stroke="#7c83ff" fill="#eef0ff"/><text x="20" y="31" class="h">Zustand</text><text x="20" y="56" class="p">Selected city, route</text><text x="20" y="77" class="p">and UI state</text></g>
  <g transform="translate(280 265)"><rect class="box" width="180" height="100" stroke="#25a77a" fill="#e9fff8"/><text x="20" y="31" class="h">TanStack Query</text><text x="20" y="56" class="p">Caching, cancellation</text><text x="20" y="77" class="p">and loading state</text></g>
  <g transform="translate(70 405)"><rect class="box" width="390" height="88" stroke="#25a77a"/><text x="22" y="31" class="h">Service layer</text><text x="22" y="56" class="p">Requests, normalization, classification and derived values</text></g>
  <g transform="translate(70 545)"><rect class="box" width="180" height="125" stroke="#e5a43a" fill="#fff9ed"/><text x="20" y="30" class="h">Browser-safe APIs</text><text x="20" y="56" class="p">Open-Meteo</text><text x="20" y="77" class="p">Census ACS, FEMA</text><text x="20" y="98" class="p">OpenStreetMap tiles</text></g>
  <g transform="translate(280 545)"><rect class="box" width="180" height="125" stroke="#e5a43a" fill="#fff9ed"/><text x="20" y="30" class="h">Local JSON</text><text x="20" y="56" class="p">Zillow market history</text><text x="20" y="77" class="p">Census population</text><text x="20" y="98" class="p">estimates</text></g>
  <g transform="translate(555 145)"><rect class="box" width="380" height="88" stroke="#8b6cff"/><text x="22" y="31" class="h">Same-origin Vite /api/* middleware</text><text x="22" y="56" class="p">CORS, server-only keys, aggregation and fallbacks</text></g>
  <g transform="translate(555 275)"><rect class="box" width="180" height="88" stroke="#8b6cff" fill="#eee8ff"/><text x="18" y="29" class="h">Current economy</text><text x="18" y="55" class="p">LAUS · QCEW</text><text x="18" y="75" class="p">QWI · BEA</text></g>
  <g transform="translate(755 275)"><rect class="box" width="180" height="88" stroke="#8b6cff" fill="#eee8ff"/><text x="18" y="29" class="h">Major employers</text><text x="18" y="55" class="p">Headquarters and</text><text x="18" y="75" class="p">federal contractors</text></g>
  <g transform="translate(555 405)"><rect class="box" width="180" height="88" stroke="#8b6cff" fill="#eee8ff"/><text x="18" y="29" class="h">Major hospitals</text><text x="18" y="55" class="p">Open facilities</text><text x="18" y="75" class="p">within 50 miles</text></g>
  <g transform="translate(755 405)"><rect class="box" width="180" height="88" stroke="#8b6cff" fill="#eee8ff"/><text x="18" y="29" class="h">Keyed proxies</text><text x="18" y="55" class="p">FBI + College</text><text x="18" y="75" class="p">Scorecard</text></g>
  <g transform="translate(555 545)"><rect class="box" width="380" height="115" stroke="#d35d91" fill="#fff0f6"/><text x="22" y="31" class="h">LAUS resilience path</text><text x="22" y="57" class="p">BLS API → official 2015–2029 flat files</text><text x="22" y="82" class="p">Files cached once per server process</text></g>
  <g transform="translate(555 715)"><rect class="box" width="380" height="90" stroke="#e5a43a" fill="#fff9ed"/><text x="22" y="31" class="h">Production deployment</text><text x="22" y="57" class="p">Recreate /api/* as serverless, edge or Node routes</text></g>
  <g transform="translate(1030 145)"><rect class="box" width="150" height="78" stroke="#25a77a"/><text x="18" y="29" class="h">BLS</text><text x="18" y="54" class="p">LAUS · QCEW</text></g>
  <g transform="translate(1205 145)"><rect class="box" width="150" height="78" stroke="#25a77a"/><text x="18" y="29" class="h">U.S. Census</text><text x="18" y="54" class="p">ACS · QWI</text></g>
  <g transform="translate(1380 145)"><rect class="box" width="150" height="78" stroke="#25a77a"/><text x="18" y="29" class="h">BEA</text><text x="18" y="54" class="p">Regional GDP</text></g>
  <g transform="translate(1030 265)"><rect class="box" width="150" height="90" stroke="#25a77a"/><text x="18" y="29" class="h">USAspending</text><text x="18" y="54" class="p">Regional contract</text><text x="18" y="74" class="p">obligations</text></g>
  <g transform="translate(1205 265)"><rect class="box" width="150" height="90" stroke="#25a77a"/><text x="18" y="29" class="h">Wikidata</text><text x="18" y="54" class="p">Headquarters and</text><text x="18" y="74" class="p">company metadata</text></g>
  <g transform="translate(1380 265)"><rect class="box" width="150" height="90" stroke="#25a77a"/><text x="18" y="29" class="h">HIFLD</text><text x="18" y="54" class="p">Hospital facilities,</text><text x="18" y="74" class="p">beds and staff</text></g>
  <g transform="translate(1030 405)"><rect class="box" width="150" height="82" stroke="#25a77a"/><text x="18" y="29" class="h">FBI Crime</text><text x="18" y="55" class="p">Data.gov key</text></g>
  <g transform="translate(1205 405)"><rect class="box" width="150" height="82" stroke="#25a77a"/><text x="18" y="29" class="h">College Scorecard</text><text x="18" y="55" class="p">Data.gov key</text></g>
  <g transform="translate(1380 405)"><rect class="box" width="150" height="82" stroke="#25a77a"/><text x="18" y="29" class="h">FCC geography</text><text x="18" y="55" class="p">County/FIPS lookup</text></g>
  <g transform="translate(1030 555)"><rect class="box" width="500" height="105" stroke="#25a77a" fill="#e9fff8"/><text x="22" y="31" class="h">Data integrity rules</text><text x="22" y="57" class="p">Missing optional fields are omitted, not invented.</text><text x="22" y="80" class="p">Estimates are labeled; exact distance requires coordinates.</text></g>
  <!-- Browser flow: connectors stay in the whitespace between cards. -->
  <path d="M185 230 V247 H160 V265" class="line" stroke="#7c6cff"/>
  <path d="M345 230 V247 H370 V265" class="line" stroke="#7c6cff"/>
  <path d="M370 365 V385 H265 V405" class="line" stroke="#25a77a" marker-end="url(#arrow-green)"/>
  <path d="M190 493 V520 H160 V545" class="line" stroke="#e5a43a"/>
  <path d="M340 493 V520 H370 V545" class="line" stroke="#e5a43a"/>

  <!-- Cross-boundary request lane runs only through the 35px column gutter. -->
  <path d="M460 449 H507 V189 H555" class="line" stroke="#7c6cff"/>

  <!-- Provider connectors use dedicated horizontal lanes above, between, or below cards. -->
  <path d="M620 363 V515 H985 V184 H1030" class="line" stroke="#7c6cff"/>
  <path d="M935 310 H1030" class="line" stroke="#7c6cff"/>
  <path d="M845 275 V245 H1280 V265" class="line" stroke="#7c6cff"/>
  <path d="M735 449 V515 H1365 V310 H1380" class="line" stroke="#7c6cff"/>
  <path d="M935 449 H982 V446 H1030" class="line" stroke="#7c6cff"/>
  <path d="M845 493 V520 H1280 V487" class="line" stroke="#7c6cff"/>

  <!-- Dashed fallback stays inside the Vite column and avoids both endpoint cards. -->
  <path d="M670 363 V520 H745 V545" fill="none" stroke="#d35d91" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
  <text x="42" y="920" class="small">Editable source: docs/homeintel-architecture.drawio · GitHub preview: docs/homeintel-architecture.svg</text>
</svg>
