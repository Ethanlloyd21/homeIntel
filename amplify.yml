version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 24
        - nvm use 24
        - npm ci --cache .npm --prefer-offline
        - node scripts/check-esbuild.mjs
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - npm run typecheck:backend
        - npm test
    build:
      commands:
        - npm run build
        - npm run check:bundle-secrets
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
